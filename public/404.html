<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A0F" />
    <title>ERROREN CHAT</title>
    <style>
      body {
        margin: 0;
        background-color: #070A0F;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Single Page App redirect handler for GitHub Pages (https://github.com/rafgraph/spa-github-pages)
      (function() {
        var l = window.location;
        // Determine whether this is a user page (username.github.io) or project repo page (username.github.io/repo)
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var pathSegmentsToKeep = 0;
        
        // If on github.io and first path segment exists and is not the username itself
        if (l.hostname.endsWith('github.io') && pathSegments.length > 0) {
          var userPrefix = l.hostname.split('.')[0];
          if (pathSegments[0] !== userPrefix) {
            pathSegmentsToKeep = 1;
          }
        }

        var repoPrefix = pathSegmentsToKeep > 0 ? '/' + pathSegments[0] : '';
        var preservedPath = '/' + pathSegments.slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
        var query = (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '');
        var target = l.protocol + '//' + l.host + repoPrefix + '/?' + preservedPath + query + l.hash;

        l.replace(target);
      })();
    </script>
  </head>
  <body>
    <div class="spinner"></div>
    <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F8FAFC;">ERROREN CHAT</div>
    <div style="margin-top: 6px; font-size: 12px; color: #64748B;">Connecting to application...</div>
  </body>
</html>
